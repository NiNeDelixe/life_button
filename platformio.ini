; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
	smougenot/TM1637@0.0.0-alpha+sha.9486982048
	esp32async/ESPAsyncWebServer@^3.10.3
	gyverlibs/GTimer@^1.1.1
	miguelbalboa/MFRC522@^1.4.12
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	jgromes/RadioLib@^7.7.1
	makuna/NeoPixelBus@^2.8.4
extra_scripts = pre:scripts/convert_web_files.py
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
build_flags = 
	-std=c++17
	-std=gnu++17
build_unflags = 
	-std=gnu++11

[env:debug]
extends = env:esp32-s3-devkitc-1
build_type = debug
build_flags = 
	${env:esp32-s3-devkitc-1.build_flags}
	-DDEBUG
build_unflags = 
	${env:esp32-s3-devkitc-1.build_unflags}
lib_deps = 
	${env:esp32-s3-devkitc-1.lib_deps}

[env:release]
extends = env:esp32-s3-devkitc-1
build_type = release
build_flags = 
	${env:esp32-s3-devkitc-1.build_flags}
	-DNDEBUG
build_unflags = 
	${env:esp32-s3-devkitc-1.build_unflags}
lib_deps = 
	${env:esp32-s3-devkitc-1.lib_deps}

[platformio]
description = Life Button for airsoft
